# Publishes a tagged version to npm with provenance. One-time setup on npmjs.com: package settings →
# Trusted Publisher → GitHub Actions → repository githubthinnd/qrcode-toolkit, workflow release.yml.
# Then release with: bump "version", update CHANGELOG.md, commit, `git tag vX.Y.Z`, `git push --follow-tags`.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - name: The tag must match package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm ci --ignore-scripts
      - name: Publish (prepublishOnly runs the full check)
        run: |
          TAG=$(node -p "require('./package.json').version.includes('-') ? 'next' : 'latest'")
          npm publish --provenance --access public --tag "$TAG"

  adapters:
    # The framework packages are published after the core, because they need its new version.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Publish the framework packages whose version is not on npm yet
        run: |
          for dir in packages/*; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published"
            else
              # ng-packagr writes the publishable package to dist/
              target="$dir"
              if [ -f "$dir/ng-package.json" ]; then target="$dir/dist"; fi
              # "./" matters: "packages/react" alone would be read as a GitHub user/repo shorthand
              npm publish "./$target" --provenance --access public
            fi
          done

  github-release:
    # A GitHub Release for the tag, with the matching CHANGELOG section as its notes.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "See CHANGELOG.md" > notes.md; fi
          flags=""
          case "$version" in *-*) flags="--prerelease" ;; esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag $flags
          fi
