version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      development-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint does not support TypeScript 7 yet
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # keep the Node typings at the oldest supported Node (22); newer majors would hide APIs that
      # do not exist there. Raise this together with "engines" in package.json.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
