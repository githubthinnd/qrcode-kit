name: Feature request
description: Suggest an addition or a change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: An API sketch helps. Note that this project has no runtime dependencies on purpose.
    validations:
      required: true
